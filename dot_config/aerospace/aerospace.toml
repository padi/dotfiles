# ~/.config/aerospace/aerospace.toml
# AeroSpace configuration (managed by chezmoi)
# See: https://github.com/nikitabobko/AeroSpace

# -----------------------------------------------------------------------------
# Default layout
# -----------------------------------------------------------------------------
layout = "bsp"

# -----------------------------------------------------------------------------
# Padding / gaps
# -----------------------------------------------------------------------------
# Window gap (equivalent to yabai's window_gap)

# Sketchybar height: the bar is 24px high at the top (per sketchybarrc).
# AeroSpace does not have an explicit `external_bar` like yabai, but windows
# will naturally avoid the area covered by sketchybar since it sits on top of
# the display. The gap above defaults to 2px; if you need more space or want
# to reserve the exact 24px for the bar, you can increase it:
# gap = 24 # uncomment to reserve top area for sketchybar
gaps.outer.top = 25

# -----------------------------------------------------------------------------
# Mouse settings (same modifier as original yabai/skhd)
# -----------------------------------------------------------------------------
[mouse]
modifier = "alt"
action1 = "move"
action2 = "resize"

# -----------------------------------------------------------------------------
# Window rules (manage = false for apps that should float)
# -----------------------------------------------------------------------------
[[rule]]
app = "^System Preferences$"
manage = false

[[rule]]
app = "^System Settings$"
manage = false

[[rule]]
app = "^Calculator$"
manage = false

[[rule]]
app = "^Karabiner-Elements$"
manage = false

[[rule]]
app = "^Mouseless$"
manage = false

[[rule]]
app = "^Keycastr$"
manage = false

[[rule]]
app = "^Books$"
manage = false

[[rule]]
app = "^mpv$"
manage = false

[[rule]]
app = "^licecap$"
manage = false

[[rule]]
app = "^Raycast$"
manage = false

[[rule]]
app = "^eqMac$"
manage = false

[[rule]]
app = "^GitX$"
manage = false

[[rule]]
app = "^MacYTDL$"
manage = false
