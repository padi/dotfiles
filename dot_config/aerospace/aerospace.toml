# ~/.config/aerospace/aerospace.toml
# AeroSpace configuration (managed by chezmoi)
# See: https://github.com/nikitabobko/AeroSpace

# Config version for compatibility and deprecations
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# -----------------------------------------------------------------------------
# Event hooks / callbacks
# -----------------------------------------------------------------------------
# Notify Sketchybar about workspace change — enables immediate update
# without needing the polling safety net for workspace switches.
#
# DEBOUNCED: Instead of spawning sketchybar on EVERY workspace change (which
# causes CPU spikes when rapidly switching), we use a debounced script that
# delays 150ms and only triggers if the workspace hasn't changed during that
# period. This prevents CPU spikes from rapid workspace switching.
exec-on-workspace-change = ["/bin/bash", "/Users/hawk/.config/aerospace/workspace_debounce.sh", "$AEROSPACE_FOCUSED_WORKSPACE"]

# -----------------------------------------------------------------------------
# Default layout
# -----------------------------------------------------------------------------
default-root-container-layout = 'tiles'

# -----------------------------------------------------------------------------
# Padding / gaps
# -----------------------------------------------------------------------------
# Window gap (equivalent to yabai's window_gap)

# Sketchybar height: the bar is 24px high at the top (per sketchybarrc).
# AeroSpace does not have an explicit `external_bar` like yabai, but windows
# will naturally avoid the area covered by sketchybar since it sits on top of
# the display. The gap above defaults to 2px; if you need more space or want
# to reserve the exact 24px for the bar, you can increase it:
# gap = 24 # uncomment to reserve top area for sketchybar
gaps.outer.top = 25

